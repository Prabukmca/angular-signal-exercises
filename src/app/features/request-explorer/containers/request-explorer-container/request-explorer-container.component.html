<h1>Request Explorer</h1>
<button (click)="copyRequest()">Copy Request</button>
<button (click)="deleteRequest()">Delete Request</button>

<div>
  @if (populationData().length) {
    <div>
      <h2>Population Data</h2>
      <ul>
        <li *ngFor="let data of populationData()">
          {{ data.Nation}}
        </li>
      </ul>
    </div>
  }
</div>
